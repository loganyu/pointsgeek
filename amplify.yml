version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@10.33.0 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - rm -f apps/web/.env.production
            - env | grep -E '^(AURORA_|AUTH_|NEXTAUTH_|ADMIN_SIGNUP_ALERT_EMAIL=|EXTENSION_ID=|LOG_LEVEL=|NEXT_PUBLIC_)' >> apps/web/.env.production || true
            - pnpm build:amplify
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - node_modules/**/*
          - apps/web/.next/cache/**/*
